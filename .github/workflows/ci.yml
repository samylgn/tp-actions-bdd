name: Pipeline Integration Continue

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      # Étape 1 : Récupérer le code
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      # Étape 2 : Préparer la base de données PostgreSQL
      - name: Preparer la base de donnees
        run: bash db/setup.sh

      # Étape 3 : Installer Python 3.10 et 3.12 via l'action officielle
      - name: Configurer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Étape 4 : Installer les dépendances (Ajoute le working-directory)
      - name: Installer les dependances
        working-directory: python-app
        run: pip install -r requirements.txt

      # Étape 5 : Lancer les tests (Ajoute le working-directory)
      - name: Executer les tests avec pytest
        working-directory: python-app
        run: pytest -v

  node:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: Preparer la bdd
        run: bash db/setup.sh

      - name: Configurer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executer npm ci
        working-directory: node-app
        run: npm ci

      - name: Executer npm test
        working-directory: node-app
        run: npm test

  java:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: Preparer la bdd
        run: bash db/setup.sh

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Executer mvn
        working-directory: java-app
        run: mvn -B package

  php:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: Praparer la bdd
        run: bash db/setup.sh

      - name: Configurer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: "pdo, pdo_pgsql"

      - name: Installer --no-interaction
        working-directory: php-app
        run: composer install --no-interaction

      - name: Executer les test php
        working-directory: php-app
        run: vendor/bin/phpunit tests

  build:
    runs-on: ubuntu-latest
    needs: [python, node, java, php]

    steps:
      - name: Construction de l'application
        run: echo "Build réussi ! Tous les tests sont validés."

  deploy:
    runs-on: ubuntu-latest
    needs: build

    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploiment en cours
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Déploiment en cours"
          test -n "$TOKEN" && echo "Token présent"
